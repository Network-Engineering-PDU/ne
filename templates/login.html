{% extends 'base.html' %}
{% load i18n %}

{% block content %}

    <div class="ne-login">
        <main class="ne-card">
            <div class="ne-brand" role="img" aria-label="Network Engineering"></div>
            <p class="ne-muted">
                {% translate 'Bienvenido a PDUSoftware. Inicie sesión con las credenciales proporcionadas.' %}
            </p>
            <form class="login" novalidate>
                <div class="ne-field">
                    <label for="inputUsername">{% translate 'User' %}</label>
                    <input type="text" id="inputUsername" class="form-control" autocomplete="username" autofocus>
                </div>
                <div class="ne-field">
                    <label for="inputPassword">{% translate 'Password' %}</label>
                    <input type="password" id="inputPassword" class="form-control" autocomplete="current-password">
                </div>
                <p id="loginError" class="ne-alert error" role="alert" hidden></p>
                <button id="btnLogin" type="button" class="ne-btn primary w-100">
                    {% translate 'Ingresar' %}
                </button>
            </form>
        </main>
    </div>

{% endblock %}

{% block scripts %}

    <script>

        $(function (){

            const LOADER = '<div class="spinner-border spinner-border-sm" role="status"></div>';

            const user_required_msg = "{% translate 'El Usuario es requerido' %}";
            const password_required_msg = "{% translate 'La Contraseña es requerida' %}";

            let inputUsername = $("#inputUsername");
            let inputPassword = $("#inputPassword");
            let btnLogin = $("#btnLogin");
            let loginError = $("#loginError");
            const showError = (msg) => loginError.text(msg || '').prop('hidden', !msg);

            btnLogin.click(function (){
                let elem = $(this);
                let originalText = elem.html();

                let username = inputUsername.val();
                let password = inputPassword.val();

                showError('');
                if (!username || username === ''){
                    showError(user_required_msg);
                    return false;
                }
                if (!password || password === ''){
                    showError(password_required_msg);
                    return false;
                }

                // send to server si hay elementos en la lista
                $.ajax({
                    type: "POST",
                    url: "{% url 'login' %}",
                    dataType: "json",
                    data: {
                        "username": username,
                        "password": password,
                        "next": "{{ next }}"
                    },
                    beforeSend: function (){
                        elem.attr('disabled', true).html(LOADER);
                    },
                    success: function(response) {
                        elem.attr('disabled', false).html(originalText);
                        if (response.result === 'ok'){
                            setTimeout(function () {
                                location.href = response.redirect_to;
                            }, 300);
                        }else{
                            showError(response.message);
                        }
                    },
                    error: function(response) {
                        elem.attr('disabled', false).html(originalText);
                        showError(response.message || "{% translate 'Error de Sistema' %}");
                    }
                });

            });

            // Enable Return Key
            inputUsername.keypress(function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    btnLogin.click();
                }
            });
            inputPassword.keypress(function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    btnLogin.click();
                }
            });

        });
    </script>

{% endblock %}
