{% extends 'base.html' %}
{% load static %}
{% load extras %}
{% load i18n %}

{% block content %}
<div class="ne-page">
    <div class="ne-page-head">
        <h1>{% translate 'Salidas' %}</h1>
        <div class="ne-actions" id="outletBulk" hidden>
            <button type="button" class="ne-btn" id="btnEnableAll">{% translate 'Activar todas' %}</button>
            <button type="button" class="ne-btn" id="btnDisableAll">{% translate 'Desactivar todas' %}</button>
        </div>
    </div>

    <div class="ne-alert warning mb-3" id="outletLicense" hidden>
        <svg class="ne-icon"><use href="#i-warn"/></svg><span id="outletLicenseText"></span>
    </div>

    <div class="ne-grid" id="outletGrid" aria-live="polite"></div>
    <div class="ne-card ne-empty" id="outletEmpty" hidden>{% translate 'No se encontraron salidas' %}</div>
</div>
{% endblock %}

{% block scripts %}
    {{ csv_urls|json_script:"csvUrls" }}
    <script>
        NE_I18N.csvUrls = JSON.parse(document.getElementById('csvUrls').textContent);
        NE_I18N.on = "{% translate 'Activada' as s %}{{ s|escapejs }}";
        NE_I18N.off = "{% translate 'Desactivada' as s %}{{ s|escapejs }}";
        NE_I18N.socket = "{% translate 'Tipo de Socket' as s %}{{ s|escapejs }}";
        NE_I18N.voltage = "{% translate 'Voltaje' as s %}{{ s|escapejs }}";
        NE_I18N.current = "{% translate 'Corriente' as s %}{{ s|escapejs }}";
        NE_I18N.activePower = "{% translate 'Potencia Activa' as s %}{{ s|escapejs }}";
        NE_I18N.reactivePower = "{% translate 'Power Reactiva' as s %}{{ s|escapejs }}";
        NE_I18N.apparentPower = "{% translate 'Potencia Aparente' as s %}{{ s|escapejs }}";
        NE_I18N.powerFactor = "{% translate 'Factor de Potencia' as s %}{{ s|escapejs }}";
        NE_I18N.energy = "{% translate 'Energia' as s %}{{ s|escapejs }}";
        NE_I18N.phase = "{% translate 'Fase V-I' as s %}{{ s|escapejs }}";
        NE_I18N.frequency = "{% translate 'Frecuencia' as s %}{{ s|escapejs }}";
        NE_I18N.fuse = "{% translate 'Fusible' as s %}{{ s|escapejs }}";
        NE_I18N.details = "{% translate 'Detalles' as s %}{{ s|escapejs }}";
        NE_I18N.download = "{% translate 'Descargar' as s %}{{ s|escapejs }}";
        NE_I18N.fuseNames = ["{% translate 'Desconocido' as s %}{{ s|escapejs }}", "{% translate 'Presente' as s %}{{ s|escapejs }}", "{% translate 'Sin tensión' as s %}{{ s|escapejs }}", "{% translate 'No disponible' as s %}{{ s|escapejs }}"];
        NE_I18N.confirmOne = "{% translate '¿Seguro que desea cambiar el estado de la salida?' as s %}{{ s|escapejs }}";
        NE_I18N.enableOne = "{% translate 'Activar' as s %}{{ s|escapejs }}";
        NE_I18N.disableOne = "{% translate 'Desactivar' as s %}{{ s|escapejs }}";
        NE_I18N.enableAllQ = "{% translate '¿Seguro que desea activar todas las salidas?' as s %}{{ s|escapejs }}";
        NE_I18N.disableAllQ = "{% translate '¿Seguro que desea desactivar todas las salidas?' as s %}{{ s|escapejs }}";
        NE_I18N.updateFailed = "{% translate 'No se pudo actualizar la salida' as s %}{{ s|escapejs }}";
        NE_I18N.updateSomeFailed = "{% translate 'No se pudieron actualizar algunas salidas' as s %}{{ s|escapejs }}";
        NE_I18N.loadFailed = "{% translate 'No se pudieron cargar las salidas' as s %}{{ s|escapejs }}";
        NE_I18N.licenseNone = "{% translate 'Su licencia no permite ver datos ni controlar las salidas.' as s %}{{ s|escapejs }}";
        NE_I18N.licenseDataOnly = "{% translate 'Su licencia no permite controlar las salidas.' as s %}{{ s|escapejs }}";
        NE_I18N.licenseControlOnly = "{% translate 'Su licencia no permite ver los datos de las salidas.' as s %}{{ s|escapejs }}";
    </script>
    <script src="{% static_v 'js/app/outputs.js' %}"></script>
{% endblock %}
